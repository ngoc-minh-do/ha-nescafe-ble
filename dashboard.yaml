type: custom:stack-in-card
cards:
  - type: custom:stack-in-card
    mode: horizontal
    card_mod:
      style: |
        ha-card {
          border: none !important;
        }
    cards:
      - type: custom:button-card
        entity: sensor.nescafe_gold_blend_barista_machine_state
        icon: mdi:coffee-maker
        name: Nescafé Barista
        show_state: true
        show_label: true
        label: |
          [[[
            const warnings = [];
        
            if (states['binary_sensor.nescafe_gold_blend_barista_no_water']?.state === 'on') {
              warnings.push('🚱 Fill water');
            }
        
            if (states['binary_sensor.nescafe_gold_blend_barista_mandatory_rinse']?.state === 'on') {
              warnings.push('🔄 Rinse required');
            }
        
            if (states['binary_sensor.nescafe_gold_blend_barista_low_coffee']?.state === 'on') {
              warnings.push('☕ Low beans');
            }
        
            return warnings.length
              ? warnings.join(' • ')
              : 'Ready to brew';
          ]]]
        tap_action:
          action: more-info
        styles:
          card:
            - padding: 12px
            - border: none
            - box-shadow: none
          grid:
            - grid-template-areas: "\"i n\" \"i s\" \"i l\""
            - grid-template-columns: 48px 1fr
          icon:
            - width: 34px
            - color: |
                [[[
                  switch(entity.state) {
                    case "READY":
                      return "#43a047";
                    case "BREWING":
                      return "#fb8c00";
                    default:
                      return "#039be5";
                  }
                ]]]
          name:
            - justify-self: start
            - font-size: 16px
            - font-weight: 600
          state:
            - justify-self: start
            - color: var(--secondary-text-color)
          label:
            - justify-self: start
            - font-size: 12px
            - color: |
                [[[
                  const hasWarning =
                    states['binary_sensor.nescafe_gold_blend_barista_no_water']?.state === 'on' ||
                    states['binary_sensor.nescafe_gold_blend_barista_mandatory_rinse']?.state === 'on' ||
                    states['binary_sensor.nescafe_gold_blend_barista_low_coffee']?.state === 'on';
        
                  return hasWarning
                    ? 'var(--error-color)'
                    : 'var(--secondary-text-color)';
                ]]]
      - type: custom:button-card
        entity: button.nescafe_gold_blend_barista_rinse
        icon: mdi:water-sync
        show_name: false
        show_state: false
        tap_action:
          action: press
        styles:
          card:
            - width: 42px
            - height: 42px
            - border-radius: 50%
      - type: custom:button-card
        entity: button.nescafe_gold_blend_barista_power
        icon: mdi:power
        show_name: false
        show_state: false
        tap_action:
          action: press
        styles:
          card:
            - width: 42px
            - height: 42px
            - border-radius: 50%
  - type: grid
    columns: 3
    square: false
    cards:
      - type: button
        entity: button.nescafe_gold_blend_barista_brew_espresso_iced_coffee
        icon: mdi:cup
        name: Espresso
      - type: button
        entity: button.nescafe_gold_blend_barista_brew_lungo_black
        icon: mdi:coffee
        name: Lungo
      - type: button
        entity: button.nescafe_gold_blend_barista_brew_latte_macchiato_cafe_latte
        icon: mdi:coffee
        name: Latte
      - type: button
        entity: button.nescafe_gold_blend_barista_brew_cappuccino
        icon: mdi:coffee
        name: Capp.
      - type: button
        entity: button.nescafe_gold_blend_barista_brew_large_lungo_large_black
        icon: mdi:coffee
        name: XL
      - type: button
        entity: button.nescafe_gold_blend_barista_hot_water
        icon: mdi:cup-water
        name: Water
